<div class="create-game-container flex flex-col items-center justify-start md-justify-center h-screen gap-lg">
  <h2>CREATE GAME</h2>

  <div class="form-group flex flex-col items-center gap-sm w-full">
    <label for="word-input">ENTER SECRET WORD:</label>
    <input id="word-input" type="text" [(ngModel)]="word" placeholder="Enter word or words" maxlength="20"
      (keyup.enter)="onCreate()" class="retro-input w-full">
    <p class="hint">Your friend will have to guess this word!</p>
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <button class="retro-btn" (click)="onCreate()" [disabled]="isLoading">
    {{ isLoading ? 'CREATING...' : 'START GAME' }}
  </button>
</div>
