<div class="create-game-container flex flex-col items-center justify-start md-justify-center h-screen gap-lg">
  <h2>CREATE GAME</h2>

  <div class="form-group flex flex-col items-center gap-sm w-full">
    <label for="word-input">ENTER WORD(S):</label>
    <input id="word-input" type="text" [(ngModel)]="word" placeholder="Enter word or words" maxlength="30"
      (keyup.enter)="onCreate()" class="retro-input w-full">
    <p class="hint">No special characters.</p>

    <div class="flex items-center gap-sm mt-sm">
      <app-retro-checkbox [(ngModel)]="isPrivate" label="MAKE PRIVATE"></app-retro-checkbox>
    </div>
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <button class="retro-btn" (click)="onCreate()" [disabled]="isLoading">
    {{ isLoading ? 'CREATING...' : 'CREATE' }}
  </button>
</div>
