<header class="retro-header flex items-center justify-between">
    <div class="logo">
        <a routerLink="/home" (click)="closeMenu()">HANGMAN</a>
    </div>

    <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Toggle menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>

    <nav class="nav-links" [class.open]="isMenuOpen">
        <ng-container *ngIf="authService.isLoggedIn">
            <span class="user-info" *ngIf="authService.currentUser">
                PLAYER: {{ authService.currentUser['name'] || authService.currentUser['email'] }}
            </span>
            <a routerLink="/create-game" class="nav-btn" (click)="closeMenu()">NEW GAME</a>
            <a *ngIf="authService.currentUser?.id === '1rwvkt8qzn5wwfb'" routerLink="/admin" class="nav-btn"
                (click)="closeMenu()">ADMIN</a>
            <button (click)="logout()" class="nav-btn logout">LOGOUT</button>
        </ng-container>

        <ng-container *ngIf="!authService.isLoggedIn">
            <a routerLink="/" class="nav-btn" (click)="closeMenu()">LOGIN</a>
        </ng-container>
    </nav>
</header>

<main class="main-content">
    <router-outlet></router-outlet>
</main>
