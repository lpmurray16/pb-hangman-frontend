<header class="retro-header flex flex-col md-flex-row items-center justify-between gap-md">
    <div class="logo">
        <a routerLink="/home">RETRO HANGMAN</a>
    </div>

    <nav class="nav-links flex items-center gap-lg">
        <ng-container *ngIf="authService.isLoggedIn">
            <span class="user-info" *ngIf="authService.currentUser">
                PLAYER: {{ authService.currentUser['name'] || authService.currentUser['email'] }}
            </span>
            <a routerLink="/create-game" class="nav-btn">NEW GAME</a>
            <a *ngIf="authService.currentUser?.id === '1rwvkt8qzn5wwfb'" routerLink="/admin" class="nav-btn">ADMIN</a>
            <button (click)="logout()" class="nav-btn logout">LOGOUT</button>
        </ng-container>

        <ng-container *ngIf="!authService.isLoggedIn">
            <a routerLink="/" class="nav-btn">LOGIN</a>
        </ng-container>
    </nav>
</header>

<main class="main-content">
    <router-outlet></router-outlet>
</main>
